---
- name: Validate the supported operating system
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version == '24.04'
      - ansible_architecture in ['x86_64', 'aarch64']
    fail_msg: Bench supports Ubuntu 24.04 LTS on AMD64 and ARM64 only.

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600
