---
- name: Create the APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  register: docker_apt_key

- name: Configure the Docker APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
    update_cache: false
  register: docker_apt_repository

- name: Update the APT cache for Docker repository changes
  ansible.builtin.apt:
    update_cache: true
  when: docker_apt_key.changed or docker_apt_repository.changed

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Add the invoking user to the Docker group
  ansible.builtin.user:
    name: "{{ bench_user }}"
    groups:
      - docker
    append: true
